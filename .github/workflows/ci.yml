name: ci

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core-tests:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select --switch /Applications/Xcode.app/Contents/Developer
      - name: Build & run TinyDeskCore self-tests
        working-directory: TinyDeskCore
        run: swift run -c release TinyDeskSelfTests
      - name: Run rich-text controller tests
        run: |
          swiftc -parse-as-library \
            Targets/TinyDesk/Sources/RichTextEditor.swift \
            Tests/RichTextEditorControllerTests.swift \
            -o /tmp/TinyDeskRichTextEditorControllerTests
          /tmp/TinyDeskRichTextEditorControllerTests
      - name: Run desktop fullscreen behavior tests
        run: |
          swiftc \
            Targets/TinyDesk/Sources/DesktopCardWindowPolicy.swift \
            Tests/DesktopCardWindowPolicyTests.swift \
            -o /tmp/TinyDeskDesktopCardWindowPolicyTests
          /tmp/TinyDeskDesktopCardWindowPolicyTests
      - name: Run library backup ZIP tests
        run: |
          swiftc -parse-as-library \
            Targets/TinyDesk/Sources/LibraryBackupArchive.swift \
            Tests/LibraryBackupArchiveTests.swift \
            -o /tmp/TinyDeskLibraryBackupArchiveTests
          /tmp/TinyDeskLibraryBackupArchiveTests
      - name: Run library backup round-trip tests
        run: |
          test_root="$(mktemp -d)"
          trap 'rm -rf "$test_root"' EXIT
          mkdir -p "$test_root/TinyDeskBackupTests/Sources"
          mkdir -p "$test_root/TinyDeskCore"
          rsync -a --exclude '.build' --exclude '.swiftpm' TinyDeskCore/ "$test_root/TinyDeskCore/"
          cp Targets/TinyDesk/Sources/LibraryFileManager.swift "$test_root/TinyDeskBackupTests/Sources/"
          cp Targets/TinyDesk/Sources/LibraryBackup.swift "$test_root/TinyDeskBackupTests/Sources/"
          cp Targets/TinyDesk/Sources/LibraryBackupArchive.swift "$test_root/TinyDeskBackupTests/Sources/"
          cp Tests/LibraryBackupRoundTripTests.swift "$test_root/TinyDeskBackupTests/Sources/main.swift"
          cat > "$test_root/TinyDeskBackupTests/Package.swift" <<'PKG'
          // swift-tools-version: 5.9
          import PackageDescription
          let package = Package(
              name: "TinyDeskBackupTests",
              platforms: [.macOS(.v14)],
              dependencies: [.package(path: "../TinyDeskCore")],
              targets: [
                  .executableTarget(
                      name: "TinyDeskBackupTests",
                      dependencies: [.product(name: "TinyDeskCore", package: "TinyDeskCore")],
                      path: "Sources"
                  )
              ]
          )
          PKG
          cd "$test_root/TinyDeskBackupTests" && swift run

  build-workspace:
    runs-on: macos-14
    needs: core-tests
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select --switch /Applications/Xcode.app/Contents/Developer
      - name: Install xcodegen
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: brew install xcodegen
      - name: Generate & build Xcode project
        run: |
          xcodegen --version
          xcodegen generate
          xcodebuild -project TinyDesk.xcodeproj -scheme TinyDesk \
            -destination 'platform=macOS,arch=arm64' \
            -configuration Debug CODE_SIGNING_ALLOWED=NO build
