name: ci

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core-tests:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select --switch /Applications/Xcode.app/Contents/Developer
      - name: Build & run TinyDeskCore self-tests
        working-directory: TinyDeskCore
        run: swift run -c release TinyDeskSelfTests
      - name: Run rich-text controller tests
        run: |
          swiftc -parse-as-library \
            Targets/TinyDesk/Sources/RichTextEditor.swift \
            Tests/RichTextEditorControllerTests.swift \
            -o /tmp/TinyDeskRichTextEditorControllerTests
          /tmp/TinyDeskRichTextEditorControllerTests
      - name: Run desktop fullscreen behavior tests
        run: |
          CORE_BUILD_DIR="$(cd TinyDeskCore && swift build -c release --show-bin-path)"
          SDK_ROOT="$(xcrun --show-sdk-path)"
          swiftc -sdk "$SDK_ROOT" \
            -I "$CORE_BUILD_DIR/Modules" \
            $(find Targets/TinyDesk/Sources -name '*.swift' ! -name 'TinyDeskApp.swift' | sort) \
            Tests/DesktopWindowManagerTests.swift \
            "$CORE_BUILD_DIR/TinyDeskCore.build/TinyDeskConst.swift.o" \
            "$CORE_BUILD_DIR/TinyDeskCore.build/DesktopCard.swift.o" \
            "$CORE_BUILD_DIR/TinyDeskCore.build/ChineseLunarCalendar.swift.o" \
            -framework AppKit -framework SwiftUI -framework EventKit \
            -framework ServiceManagement -framework Carbon \
            -o /tmp/TinyDeskDesktopWindowManagerTests
          /tmp/TinyDeskDesktopWindowManagerTests

  build-workspace:
    runs-on: macos-14
    needs: core-tests
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select --switch /Applications/Xcode.app/Contents/Developer
      - name: Install xcodegen
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: brew install xcodegen
      - name: Generate & build Xcode project
        run: |
          xcodegen --version
          xcodegen generate
          xcodebuild -project TinyDesk.xcodeproj -scheme TinyDesk \
            -destination 'platform=macOS,arch=arm64' \
            -configuration Debug CODE_SIGNING_ALLOWED=NO build
